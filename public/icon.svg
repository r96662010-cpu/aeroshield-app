<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Protective Shield -->
  <path d="M 256,76 L 396,136 C 396,280 336,376 256,436 C 176,376 116,280 116,136 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.2"/>
  <path d="M 256,86 L 384,142 C 384,272 328,362 256,420 C 184,362 128,272 128,142 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Clean Air Wind Waves inside Shield -->
  <path d="M 190,210 C 220,190 270,190 322,210" 
        fill="none" 
        stroke="#6ee7b7" 
        stroke-width="14" 
        stroke-linecap="round"/>
  <path d="M 160,260 C 210,230 280,230 352,260" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="16" 
        stroke-linecap="round"/>
  <path d="M 200,310 C 230,285 275,285 312,310" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Central Air Quality Core Node -->
  <circle cx="256" cy="256" r="16" fill="#ecfdf5" filter="url(#glow)"/>
</svg>
